<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Polymarket Temp Bot</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}?v=20260514-dashboard-v17">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">Polymarket Temperature Bot</div>
        <h1>Multi-City Live Desk</h1>
      </div>
      <div class="top-actions">
        <div id="connection" class="pill neutral">A ligar</div>
        <div id="mode" class="pill">UNKNOWN</div>
      </div>
    </header>

    <section class="metrics">
      <article class="metric">
        <span>Cidades</span>
        <strong id="m-cities">--</strong>
      </article>
      <article class="metric">
        <span>Sinais</span>
        <strong id="m-signals">--</strong>
      </article>
      <article class="metric">
        <span>Posições</span>
        <strong id="m-positions">--</strong>
      </article>
      <article class="metric capital">
        <span>Capital inicial</span>
        <strong id="m-capital-start">--</strong>
      </article>
      <article class="metric capital">
        <span>Capital atual</span>
        <strong id="m-capital-now">--</strong>
      </article>
      <article class="metric">
        <span>PnL dia</span>
        <strong id="m-pnl">--</strong>
      </article>
      <article class="metric">
        <span>Trades</span>
        <strong id="m-trades">--</strong>
      </article>
      <article class="metric">
        <span>Atualizado</span>
        <strong id="m-updated">--</strong>
      </article>
    </section>

    <main class="layout">
      <aside class="left-side">
        <section class="panel watch-panel">
          <div class="section-head compact">
            <h2>Cidades</h2>
            <span id="watch-count" class="hint">0</span>
          </div>
          <div id="watchlist" class="markets"></div>
        </section>
        <section class="panel positions-panel">
          <div class="section-head compact">
            <h2>Posições</h2>
            <span id="position-count" class="hint">0</span>
          </div>
          <div id="positions" class="positions"></div>
        </section>
      </aside>

      <section class="right-side">
        <section class="panel detail-panel">
          <div class="section-head">
            <h2>Cidade Selecionada</h2>
            <div class="hint" id="source">--</div>
          </div>
          <div class="section-head compact">
            <span id="selected-city" class="hint">Nenhuma</span>
          </div>
          <div id="city-detail" class="city-detail">
            <div class="empty">Seleciona uma cidade na coluna “Cidades”.</div>
          </div>
        </section>
      </section>
    </main>
  </div>

  <script src="{{ url_for('static', filename='dashboard.js') }}?v=20260514-dashboard-v17"></script>
</body>
</html>
